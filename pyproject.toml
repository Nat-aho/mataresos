[project]
name = "mataresos"
version = "0.1.0"
description = "Projectes per la Colla Castellera de Los Mataresos de l'Alguer"
readme = "README.md"
authors = [
    { name = "Natascia Caria", email = "natascia.caria@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
mataresos = "mataresos:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mataresos"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
